# Azure DevOps CI Pipeline for FitLink API
trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main
      - dev

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: '1. Setup Node.js 20'

- script: |
    npm install --prefer-offline --no-audit
  displayName: '2. Install Dependencies (npm install)'

- script: |
    npx vitest run src/__tests__/pricing.test.js
  displayName: '3. Run Core Pricing Unit Tests'

- script: |
    npm run build
  displayName: '4. Verify Babel Production Build'

- powershell: |
    docker info > $null 2>&1
    if ($LASTEXITCODE -eq 0) {
        Write-Host "Docker daemon is active. Verifying multi-stage Docker build..."
        docker build -t fitlink-api:ci-test .
        if ($LASTEXITCODE -ne 0) { exit 1 }
    } else {
        Write-Host "##vso[task.logissue type=warning]Docker Desktop is not currently running. Skipping container build verification."
    }
  displayName: '5. Verify Multi-Stage Dockerfile Build'