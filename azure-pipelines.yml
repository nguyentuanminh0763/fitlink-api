# Azure DevOps CI/CD Pipeline for FitLink API
trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main
      - dev

pool:
  name: 'Default'


steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: '1. Setup Node.js 20'

- script: |
    npm ci
  displayName: '2. Install Clean Dependencies (npm ci)'

- script: |
    npx vitest run src/__tests__/pricing.test.js
  displayName: '3. Run Core Pricing Unit Tests'

- script: |
    npm run build
  displayName: '4. Verify Babel Production Build'

- task: Docker@2
  displayName: '5. Build and Push to Azure Container Registry (CD)'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  inputs:
    containerRegistry: 'fitlinkacr-sc'
    repository: 'fitlink-api'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latest

- powershell: |
    docker info > $null 2>&1
    if ($LASTEXITCODE -eq 0) {
        Write-Host "Verifying Docker build for PR..."
        docker build -t fitlink-api:ci-test .
        if ($LASTEXITCODE -ne 0) { exit 1 }
    }
  condition: eq(variables['Build.Reason'], 'PullRequest')
  displayName: '5. Verify Multi-Stage Dockerfile Build (PR Validation Only)'

